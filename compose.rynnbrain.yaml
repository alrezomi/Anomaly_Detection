services:
  rynnbrain:
    build:
      context: .
      dockerfile: Dockerfile.rynnbrain
    image: anomaly-detection-rynnbrain:local
    init: true
    shm_size: "4gb"
    gpus: all
    volumes:
      - ${ANOMALY_DATA_DIR:-../data}:/data:ro
      - ${ANOMALY_OUTPUT_DIR:-./outputs}:/outputs
      - ${PIPELINE_CONFIG_FILE:-./pipeline_config.json}:/config/pipeline_config.json:ro
      - rynnbrain-huggingface-cache:/cache/huggingface

volumes:
  rynnbrain-huggingface-cache:
