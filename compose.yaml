x-pipeline-common: &pipeline-common
  build:
    context: .
    dockerfile: Dockerfile
  image: anomaly-detection:local
  init: true
  shm_size: "2gb"
  environment:
    ANOMALY_DATA_ROOT: /data
    ANOMALY_OUTPUT_ROOT: /outputs
  volumes:
    # Host paths are configured in the local .env file.
    - ${ANOMALY_DATA_DIR:-../data}:/data:ro
    - ${ANOMALY_OUTPUT_DIR:-./outputs}:/outputs
    - huggingface-cache:/cache/huggingface

services:
  # Legacy MP4/MCAP launcher.
  pipeline:
    <<: *pipeline-common
    entrypoint: ["python", "launch_pipeline.py"]
    command: ["both"]

  # Configured ROS bag vision launcher.
  rosbag-vision:
    <<: *pipeline-common
    entrypoint: ["python", "run_rosbag_vision.py"]
    command: ["--config", "/config/pipeline_config.json"]
    volumes:
      - ${ANOMALY_DATA_DIR:-../data}:/data:ro
      - ${ANOMALY_OUTPUT_DIR:-./outputs}:/outputs
      - ${PIPELINE_CONFIG_FILE:-./pipeline_config.json}:/config/pipeline_config.json:ro
      - huggingface-cache:/cache/huggingface

  # Generate clean labels plus timestamp diagnostics from recorded stages.
  bag-labels:
    <<: *pipeline-common
    entrypoint: ["python", "build_dataset_manifest.py"]
    command:
      - /data
      - --output
      - /outputs/dataset_labels.csv
      - --details-output
      - /outputs/dataset_labels_details.csv
      - --startup-ignore-sec
      - ${STAGE_STARTUP_IGNORE_SEC:-0.1}
      - --recursive

  # Optional RynnBrain VLM evaluator. It shares this Compose project but keeps
  # its model dependencies isolated from the stable DINO/time-series image.
  rynnbrain:
    build:
      context: .
      dockerfile: Dockerfile.rynnbrain
      args:
        RYNNBRAIN_BASE_IMAGE: ${RYNNBRAIN_BASE_IMAGE:-pytorch/pytorch:2.11.0-cuda12.6-cudnn9-runtime}
    image: anomaly-detection-rynnbrain:local
    init: true
    shm_size: "4gb"
    gpus: all
    volumes:
      - ${ANOMALY_DATA_DIR:-../data}:/data:ro
      - ${ANOMALY_OUTPUT_DIR:-./outputs}:/outputs
      - ${PIPELINE_CONFIG_FILE:-./pipeline_config.json}:/config/pipeline_config.json:ro
      - huggingface-cache:/cache/huggingface
    entrypoint: ["python", "-m", "rynnbrain_vlm.run"]
    command: ["--config", "/config/pipeline_config.json"]

volumes:
  huggingface-cache:
